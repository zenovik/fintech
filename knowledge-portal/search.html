<main id="app"><h1>Semantic Search</h1><input id="q" placeholder="Search..." oninput="doSearch(this.value)"><div id="r"></div><script>async function doSearch(q){const s=await loadSearch();const terms=q.toLowerCase().split(/\s+/);let ids=new Set();for(const t of terms){for(const k of Object.keys(s.index||{})){if(k.includes(t))(s.index[k]||[]).forEach(x=>ids.add(x.id));}}document.getElementById('r').innerHTML='<p>'+ids.size+' matches</p>'+renderTable([...ids].slice(0,50).map(id=>({id})),['id']);}</script></main>
<script src="portal.js"></script></body></html>
