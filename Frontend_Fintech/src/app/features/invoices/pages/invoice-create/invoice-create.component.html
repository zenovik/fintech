<div class="inv-page">
  <div class="inv-page__header">
    <div><h1 class="inv-page__title">Create Invoice</h1><p class="inv-page__subtitle">Add line items and configure billing details.</p></div>
    <a routerLink="/invoices" class="inv-btn inv-btn--secondary">Back</a>
  </div>
  @if (error()) { <div class="inv-card" style="color:#b42318">{{ error() }}</div> }
  <div class="inv-card">
    <form (ngSubmit)="submit()">
      <div class="inv-form-grid">
        <div><label>Merchant ID *</label><input type="number" [(ngModel)]="merchantId" name="merchantId" required /></div>
        <div><label>Customer ID *</label><input type="number" [(ngModel)]="customerId" name="customerId" required /></div>
        <div><label>Reference</label><input type="text" [(ngModel)]="referenceNumber" name="referenceNumber" /></div>
        <div><label>Currency</label><select [(ngModel)]="currency" name="currency">@for (c of currencies; track c.key) { <option [value]="c.key">{{ c.label }}</option> }</select></div>
        <div><label>Issue Date *</label><input type="date" [(ngModel)]="issueDate" name="issueDate" required /></div>
        <div><label>Due Date *</label><input type="date" [(ngModel)]="dueDate" name="dueDate" required /></div>
        <div><label>Header Tax</label><input type="number" step="0.01" [(ngModel)]="taxAmount" name="taxAmount" /></div>
        <div><label>Header Discount</label><input type="number" step="0.01" [(ngModel)]="discountAmount" name="discountAmount" /></div>
        <div style="grid-column:1/-1"><label>Notes</label><textarea rows="2" [(ngModel)]="notes" name="notes"></textarea></div>
        <div style="grid-column:1/-1"><label>Internal Notes</label><textarea rows="2" [(ngModel)]="internalNotes" name="internalNotes"></textarea></div>
        <div><label><input type="checkbox" [(ngModel)]="generatePaymentLink" name="generatePaymentLink" /> Generate payment link</label></div>
      </div>
      <h3 style="margin:20px 0 12px">Line Items</h3>
      <table class="inv-line-items">
        <thead><tr><th>Description</th><th>Qty</th><th>Unit Price</th><th>Tax</th><th>Discount</th><th></th></tr></thead>
        <tbody>
          @for (li of lineItems; track $index; let i = $index) {
            <tr>
              <td><input [(ngModel)]="li.description" [name]="'desc'+i" style="width:100%" /></td>
              <td><input type="number" step="0.01" [(ngModel)]="li.quantity" [name]="'qty'+i" style="width:70px" /></td>
              <td><input type="number" step="0.01" [(ngModel)]="li.unitPrice" [name]="'price'+i" style="width:90px" /></td>
              <td><input type="number" step="0.01" [(ngModel)]="li.tax" [name]="'tax'+i" style="width:70px" /></td>
              <td><input type="number" step="0.01" [(ngModel)]="li.discount" [name]="'disc'+i" style="width:70px" /></td>
              <td><button type="button" class="inv-btn inv-btn--secondary" (click)="removeLine(i)">×</button></td>
            </tr>
          }
        </tbody>
      </table>
      <button type="button" class="inv-btn inv-btn--secondary" style="margin-top:8px" (click)="addLine()">Add Line</button>
      <div style="margin-top:20px;display:flex;gap:8px">
        <button type="submit" class="inv-btn inv-btn--primary" [disabled]="saving()">@if (saving()) { <mat-spinner diameter="20" /> } @else { Create Invoice }</button>
      </div>
    </form>
  </div>
</div>
