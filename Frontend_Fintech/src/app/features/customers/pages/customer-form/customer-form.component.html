<div class="cust-page">
  <div class="cust-page__header">
    <div>
      <a routerLink="/customers" style="font-size:13px;color:#667085;text-decoration:none">← Customers</a>
      <h1 class="cust-page__title">{{ isEdit() ? 'Edit Customer' : 'Add Customer' }}</h1>
    </div>
  </div>

  @if (loading()) {
    <div class="cust-loading"><mat-spinner diameter="40" /></div>
  } @else {
    @if (error()) { <p style="color:#b42318;margin-bottom:12px">{{ error() }}</p> }

    <div class="cust-card">
      <form (ngSubmit)="submit()">
        <div class="cust-form-grid">
          <div>
            <label>First Name *</label>
            <input type="text" [(ngModel)]="form.firstName" name="firstName" required />
          </div>
          <div>
            <label>Last Name</label>
            <input type="text" [(ngModel)]="form.lastName" name="lastName" />
          </div>
          <div>
            <label>Display Name</label>
            <input type="text" [(ngModel)]="form.displayName" name="displayName" />
          </div>
          <div>
            <label>Email</label>
            <input type="email" [(ngModel)]="form.email" name="email" />
          </div>
          <div>
            <label>Phone</label>
            <input type="text" [(ngModel)]="form.phone" name="phone" />
          </div>
          <div>
            <label>Company</label>
            <input type="text" [(ngModel)]="form.companyName" name="companyName" />
          </div>
          <div>
            <label>Type</label>
            <select [(ngModel)]="form.customerType" name="customerType">
              <option value="individual">Individual</option>
              <option value="business">Business</option>
            </select>
          </div>
          <div>
            <label>Status</label>
            <select [(ngModel)]="form.status" name="status">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
              <option value="blocked">Blocked</option>
              <option value="pending">Pending</option>
            </select>
          </div>
          <div>
            <label>KYC Status</label>
            <select [(ngModel)]="form.kycStatus" name="kycStatus">
              <option value="pending">Pending</option>
              <option value="verified">Verified</option>
              <option value="rejected">Rejected</option>
              <option value="not_required">Not Required</option>
            </select>
          </div>
          <div>
            <label>Risk Level</label>
            <select [(ngModel)]="form.riskLevel" name="riskLevel">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div style="grid-column:1/-1">
            <label>Notes</label>
            <textarea [(ngModel)]="form.notes" name="notes" rows="3"></textarea>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:20px">
          <button type="submit" class="cust-btn cust-btn--primary" [disabled]="saving()">
            {{ saving() ? 'Saving...' : (isEdit() ? 'Update Customer' : 'Create Customer') }}
          </button>
          <a routerLink="/customers" class="cust-btn cust-btn--secondary">Cancel</a>
        </div>
      </form>
    </div>
  }
</div>
