<div class="qr-page">
  <div class="qr-page__header">
    <div>
      <h1 class="qr-page__title">New QR Code</h1>
      <p class="qr-page__subtitle">Create a QR code for scan-to-pay collections.</p>
    </div>
    <a routerLink="/qr-payments" class="qr-btn qr-btn--secondary">Back</a>
  </div>

  @if (error()) { <p style="color:#b42318;margin-bottom:16px">{{ error() }}</p> }

  <div class="qr-card">
    <form (ngSubmit)="submit()">
      <div class="qr-form-grid">
        <div><label>Merchant ID *</label><input type="number" [(ngModel)]="merchantId" name="merchantId" required /></div>
        <div><label>Customer ID</label><input type="number" [(ngModel)]="customerId" name="customerId" /></div>
        <div><label>QR Type</label>
          <select [(ngModel)]="qrType" name="qrType">
            @for (t of qrTypes; track t.key) { <option [value]="t.key">{{ t.label }}</option> }
          </select>
        </div>
        <div><label>Title *</label><input type="text" [(ngModel)]="title" name="title" required /></div>
        <div><label>Amount</label><input type="number" step="0.01" [(ngModel)]="amount" name="amount" /></div>
        <div><label>Currency</label>
          <select [(ngModel)]="currency" name="currency">
            @for (c of currencies; track c.key) { <option [value]="c.key">{{ c.label }}</option> }
          </select>
        </div>
        <div><label>Expires At</label><input type="datetime-local" [(ngModel)]="expiresAt" name="expiresAt" /></div>
        <div style="display:flex;align-items:center;gap:8px;padding-top:24px">
          <input type="checkbox" id="allowCustom" [(ngModel)]="allowCustomAmount" name="allowCustomAmount" />
          <label for="allowCustom" style="margin:0">Allow custom amount</label>
        </div>
        <div style="grid-column:1/-1"><label>Description</label><textarea rows="3" [(ngModel)]="description" name="description"></textarea></div>
      </div>
      <div style="margin-top:20px;display:flex;gap:8px">
        <button type="submit" class="qr-btn qr-btn--primary" [disabled]="saving()">
          @if (saving()) { <mat-spinner diameter="20" /> } @else { Create QR Code }
        </button>
        <a routerLink="/qr-payments" class="qr-btn qr-btn--secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
