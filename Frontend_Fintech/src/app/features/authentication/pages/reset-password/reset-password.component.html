<app-auth-layout [maxWidth]="'lg'">
  <div class="reset-card">
    <header class="reset-card__header">
      <div class="reset-card__icon">
        <span class="material-symbols-outlined">lock_reset</span>
      </div>
      <h1 class="reset-card__title">Reset Your Password</h1>
      <p class="reset-card__subtitle">
        Please choose a new, strong password to secure your Merchant Pro account.
      </p>
    </header>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="auth-field">
        <label class="auth-field__label" for="newPassword">New Password</label>
        <div class="auth-field__wrapper">
          <span class="material-symbols-outlined auth-field__icon">key</span>
          <input
            id="newPassword"
            class="auth-field__input"
            [type]="showNewPassword ? 'text' : 'password'"
            formControlName="newPassword"
            placeholder="Enter new password"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="auth-field__toggle"
            (click)="showNewPassword = !showNewPassword"
          >
            <span class="material-symbols-outlined">{{
              showNewPassword ? 'visibility_off' : 'visibility'
            }}</span>
          </button>
        </div>
      </div>

      <app-password-requirements [password]="form.controls.newPassword.value" />

      <div class="auth-field">
        <label class="auth-field__label" for="confirmPassword">Confirm Password</label>
        <div class="auth-field__wrapper">
          <span class="material-symbols-outlined auth-field__icon">verified_user</span>
          <input
            id="confirmPassword"
            class="auth-field__input"
            [class.invalid]="passwordMismatch"
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="Repeat your password"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="auth-field__toggle"
            (click)="showConfirmPassword = !showConfirmPassword"
          >
            <span class="material-symbols-outlined">{{
              showConfirmPassword ? 'visibility_off' : 'visibility'
            }}</span>
          </button>
        </div>
        @if (passwordMismatch) {
          <span class="auth-field__error">
            <span class="material-symbols-outlined">error</span>
            Passwords do not match
          </span>
        }
      </div>

      <button class="auth-btn" type="submit" [disabled]="loading || form.invalid || success">
        @if (loading) {
          <mat-spinner diameter="20" />
          <span>Updating...</span>
        } @else if (success) {
          <span class="material-symbols-outlined">check_circle</span>
          <span>Password Updated</span>
        } @else {
          <span>Update Password</span>
          <span class="material-symbols-outlined">arrow_forward</span>
        }
      </button>

      <div class="reset-card__back">
        <a class="auth-link" [routerLink]="loginRoute">Back to Sign In</a>
      </div>
    </form>
  </div>
</app-auth-layout>
