<app-auth-layout [maxWidth]="'lg'">
  <div class="access-denied">
    <div class="access-denied__code">403</div>
    <div class="access-denied__icon">
      <span class="material-symbols-outlined">gpp_bad</span>
    </div>
    <h1 class="access-denied__title">Access Denied</h1>
    <p class="access-denied__text">
      You don't have permission to access this resource. If you believe this is an error, please
      contact your administrator or sign in with a different account.
    </p>
    <div class="access-denied__actions">
      <a class="auth-btn" [routerLink]="sessionsRoute">Go to Sessions</a>
      <a class="access-denied__link" [routerLink]="loginRoute">Sign in with another account</a>
    </div>
  </div>
</app-auth-layout>
