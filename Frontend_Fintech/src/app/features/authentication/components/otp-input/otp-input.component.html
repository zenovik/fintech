<div class="otp-input" role="group" [attr.aria-label]="'Verification code, ' + length + ' digits'">
  @for (digit of digits; track $index; let i = $index) {
    @if (i === 3 && length === 6) {
      <span class="otp-input__separator" aria-hidden="true"></span>
    }
    <input
      #otpCell
      class="otp-input__cell"
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
      maxlength="1"
      autocomplete="one-time-code"
      [value]="digit"
      [disabled]="disabled"
      [attr.aria-label]="'Digit ' + (i + 1)"
      (input)="onInput(i, $event)"
      (keydown)="onKeyDown(i, $event)"
      (paste)="onPaste($event)"
    />
  }
</div>
