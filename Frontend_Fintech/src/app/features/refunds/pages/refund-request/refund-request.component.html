<div class="ref-page">
  <div class="ref-page__header">
    <div>
      <a routerLink="/refunds" style="font-size:13px;color:#667085;text-decoration:none">← Refund Queue</a>
      <h1 class="ref-page__title">New Refund Request</h1>
      <p class="ref-page__subtitle">Submit a partial or full refund against an existing transaction.</p>
    </div>
  </div>

  @if (error()) { <p style="color:#b42318;margin-bottom:12px">{{ error() }}</p> }

  <div class="ref-card">
    <form (ngSubmit)="submit()">
      <div class="ref-form-grid">
        <div>
          <label>Transaction ID *</label>
          <input type="number" [(ngModel)]="transactionId" name="transactionId" placeholder="e.g. 1" required />
        </div>
        <div>
          <label>Refund Amount *</label>
          <input type="number" step="0.01" [(ngModel)]="amount" name="amount" placeholder="0.00" required />
        </div>
        <div style="grid-column:1/-1">
          <label>Reason</label>
          <textarea [(ngModel)]="reason" name="reason" rows="3" placeholder="Reason for refund request"></textarea>
        </div>
      </div>
      <p style="font-size:13px;color:#667085;margin-top:8px">Refund type (full/partial) is determined automatically based on the amount vs transaction balance.</p>
      <div style="display:flex;gap:8px;margin-top:20px">
        <button type="submit" class="ref-btn ref-btn--primary" [disabled]="saving()">{{ saving() ? 'Submitting...' : 'Submit Request' }}</button>
        <a routerLink="/refunds" class="ref-btn ref-btn--secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
