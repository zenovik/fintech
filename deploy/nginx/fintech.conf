# Nginx reverse proxy for host-based deployment (PM2 backend + static frontend).
# Copy to /etc/nginx/sites-available/fintech and symlink to sites-enabled.
#
# Prerequisites:
#   - Frontend built: npm run build:prod (output: Frontend_Fintech/dist/frontend-fintech/browser)
#   - Backend running on 127.0.0.1:3000 via PM2
#   - Update server_name and root path below

upstream fintech_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Update to your deployed frontend build path
    root /var/www/fintech/Frontend_Fintech/dist/frontend-fintech/browser;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    client_max_body_size 10m;

    location ~* \.(?:css|js|mjs|map|woff2?|ttf|eot|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://fintech_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /api/docs {
        proxy_pass http://fintech_backend/api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
